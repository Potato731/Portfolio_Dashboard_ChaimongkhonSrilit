<script>
    function safeGetLS(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function safeSetLS(key, value) { try { localStorage.setItem(key, value); } catch (e) { console.warn("เบราว์เซอร์บล็อกการบันทึก"); } }

    const STORAGE_KEY = 'MasterPortfolio_DB_Ultimate23_Fast'; 
    const EVAL_KEY = 'MasterPortfolio_EVAL_DB_v10';
    const BASE_DATA = []; 

    // ================== FIREBASE INITIALIZATION ==================
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID.asia-southeast1.firebasedatabase.app",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    
    // ตรวจสอบและเริ่มต้นใช้งาน Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    // ============================================================

    let rawData = loadData(); let evalData = loadEvalData();
    let isAdmin = false; let editingId = null; let currentLightboxId = null; let currentLightboxImages = []; let currentLightboxIndex = 0; let editingProjectImages = [];
    let typeChart = null; let statusChart = null; let monthlyChart = null; let decisionChart = null; let radarChart = null; let monthFocusChart = null; let kpiRadarChart = null; let kpiBarChart = null;
    let isDefaultSet = false;

    // ============ MOUSE TRACKER แหวกคลื่นใต้น้ำ ============
    let isMouseTicking = false;
    document.addEventListener('mousemove', (e) => {
        if (!isMouseTicking) {
            window.requestAnimationFrame(() => {
                const bg = document.getElementById('ocean-bg');
                if(bg) {
                    bg.style.setProperty('--mx', e.clientX + 'px');
                    bg.style.setProperty('--my', e.clientY + 'px');
                    const shiftX = (e.clientX / window.innerWidth - 0.5) * 30;
                    bg.style.setProperty('--wave-shift', shiftX + 'px');
                }
                isMouseTicking = false;
            });
            isMouseTicking = true;
        }
    });

    function toggleKpiSection(btnEl) {
        const c = document.getElementById('kpiIndicatorsContent');
        if(c.style.display === 'none') {
            c.style.display = 'block';
            btnEl.innerHTML = '👁️ ซ่อน';
        } else {
            c.style.display = 'none';
            btnEl.innerHTML = '🙈 แสดง';
        }
    }
    window.toggleKpiSection = toggleKpiSection;

    function populateDateFilters() {
        let dayHtml = '<option value="all">📅 ทุกวัน</option>';
        for(let i=1; i<=31; i++) { let val = i.toString().padStart(2, '0'); dayHtml += `<option value="${val}">${val}</option>`; }
        let monthHtml = '<option value="all">🗓️ ทุกเดือน</option>';
        const monthNames = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
        for(let i=0; i<12; i++) { let val = (i+1).toString().padStart(2, '0'); monthHtml += `<option value="${val}">${monthNames[i]}</option>`; }
        let yearHtml = '<option value="all">📆 ทุกปี</option><option value="nodate" style="color:var(--danger); font-weight:bold;">⚠️ งานที่ยังไม่ระบุวันที่</option>';
        const currentYear = new Date().getFullYear();
        for(let y=Math.max(2027, currentYear + 1); y>=2024; y--) { yearHtml += `<option value="${y}">${y+543}</option>`; }
        
        ['filterDay', 'scFilterDay'].forEach(id => { if(document.getElementById(id) && document.getElementById(id).options.length === 0) document.getElementById(id).innerHTML = dayHtml; });
        ['filterMonth', 'scFilterMonth', 'msFilterMonth', 'kpiFilterMonth'].forEach(id => { if(document.getElementById(id) && document.getElementById(id).options.length === 0) document.getElementById(id).innerHTML = monthHtml; });
        ['filterYear', 'scFilterYear', 'msFilterYear', 'kpiFilterYear'].forEach(id => { if(document.getElementById(id) && document.getElementById(id).options.length === 0) document.getElementById(id).innerHTML = yearHtml; });
    }

    function loadData() { const str = safeGetLS(STORAGE_KEY); if (str && str !== "[]") { try { return JSON.parse(str); } catch (e) {} } return JSON.parse(JSON.stringify(BASE_DATA)); }
    function loadEvalData() { const str = safeGetLS(EVAL_KEY); if (str) { try { return JSON.parse(str); } catch (e) {} } return []; }
    
    // ================== SAVE TO FIREBASE ==================
    function saveData() { 
        safeSetLS(STORAGE_KEY, JSON.stringify(rawData)); 
        database.ref('projects').set(rawData).catch(err => console.error("Firebase save error:", err)); 
    }
    function saveEvalData() { 
        safeSetLS(EVAL_KEY, JSON.stringify(evalData)); 
        database.ref('evaluations').set(evalData).catch(err => console.error("Firebase save error:", err)); 
    }
    // ======================================================

    function exportBackup() {
        const payload = { app: 'MasterPortfolio', exportedAt: new Date().toISOString(), projects: rawData, evaluations: evalData };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const stamp = new Date().toISOString().slice(0,10);
        a.href = url; a.download = `Portfolio_Backup_${stamp}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    window.exportBackup = exportBackup;

    function triggerImportBackup() { const el = document.getElementById('importBackupInput'); if (el) el.click(); }
    window.triggerImportBackup = triggerImportBackup;

    function importBackup(event) {
        const file = event.target.files && event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const payload = JSON.parse(e.target.result);
                const incomingProjects = Array.isArray(payload.projects) ? payload.projects : (Array.isArray(payload) ? payload : null);
                const incomingEvals = Array.isArray(payload.evaluations) ? payload.evaluations : [];
                if (!incomingProjects) { alert('ไฟล์นี้ไม่ใช่ไฟล์สำรองข้อมูลที่ถูกต้อง'); return; }
                const replace = confirm(`พบข้อมูล ${incomingProjects.length} โปรเจกต์ในไฟล์สำรอง\n\nกด "ตกลง" เพื่อแทนที่ข้อมูลปัจจุบันทั้งหมด\nกด "ยกเลิก" เพื่อรวมเข้ากับข้อมูลปัจจุบัน (ไม่แทนที่)`);
                if (replace) { rawData = incomingProjects; evalData = incomingEvals; }
                else {
                    const maxId = rawData.length > 0 ? Math.max(...rawData.map(p => p['ลำดับ'] || 0)) : 0;
                    incomingProjects.forEach((p, i) => { rawData.push({ ...p, 'ลำดับ': maxId + i + 1 }); });
                    evalData = [...evalData, ...incomingEvals];
                }
                saveData(); saveEvalData(); refreshAll(true);
                alert('นำเข้าข้อมูลเรียบร้อยแล้ว ✅');
            } catch (err) { alert('ไม่สามารถอ่านไฟล์นี้ได้ กรุณาตรวจสอบว่าเป็นไฟล์ JSON ที่ถูกต้อง'); }
            event.target.value = '';
        };
        reader.readAsText(file);
    }
    window.importBackup = importBackup;
    function formatDateThai(d) { if (!d) return '-'; const date = new Date(d); if (isNaN(date)) return '-'; return date.toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'2-digit' }); }
    
    function getDaysDiff(startStr, endStr) {
        if (!startStr || !endStr) return null;
        const s = new Date(startStr); const e = new Date(endStr);
        if (isNaN(s) || isNaN(e)) return null;
        let days = Math.ceil((e - s) / (1000 * 60 * 60 * 24)); return days <= 0 ? 1 : days; 
    }

    function setTheme(themeName) {
        document.documentElement.setAttribute('data-theme', themeName);
        document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.querySelector(`.theme-btn[onclick="setTheme('${themeName}')"]`);
        if (activeBtn) activeBtn.classList.add('active');
        safeSetLS('portfolio_theme', themeName);
        
        const style = getComputedStyle(document.documentElement);
        const artworkColor = style.getPropertyValue('--artwork').trim() || '#f472b6'; const videoColor = style.getPropertyValue('--video').trim() || '#fde047'; const photoColor = style.getPropertyValue('--photo').trim() || '#5eead4';
        const successColor = style.getPropertyValue('--success').trim() || '#34d399'; const dangerColor = style.getPropertyValue('--danger').trim() || '#fb7185';
        const primaryColor = style.getPropertyValue('--primary').trim() || '#a78bfa'; const primary2Color = style.getPropertyValue('--primary-2').trim() || '#38bdf8';
        const textColor = style.getPropertyValue('--text').trim() || '#ffffff'; const mutedColor = style.getPropertyValue('--muted').trim() || '#94a3b8'; const lineColor = style.getPropertyValue('--line').trim() || 'rgba(255,255,255,0.1)';
        const panelColor = style.getPropertyValue('--panel-solid').trim() || '#121521';

        try {
            if (typeof typeChart !== 'undefined' && typeChart) {
                typeChart.data.datasets[0].backgroundColor = [artworkColor, videoColor, photoColor]; statusChart.data.datasets[0].backgroundColor = [successColor, videoColor, artworkColor]; typeChart.update(); statusChart.update();
                if(monthlyChart) {
                    const ctx = document.getElementById('monthlyChart').getContext('2d'); const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                    gradient.addColorStop(0, primary2Color); gradient.addColorStop(1, primaryColor);
                    monthlyChart.data.datasets[0].backgroundColor = gradient; monthlyChart.options.scales.x.ticks.color = mutedColor; monthlyChart.options.scales.y.ticks.color = mutedColor; monthlyChart.options.scales.y.grid.color = lineColor;
                    monthlyChart.options.plugins.tooltip.backgroundColor = panelColor; monthlyChart.options.plugins.tooltip.titleColor = textColor; monthlyChart.options.plugins.tooltip.bodyColor = mutedColor; monthlyChart.update();
                }
                if(decisionChart) { decisionChart.data.datasets[0].backgroundColor = [successColor, videoColor, dangerColor]; decisionChart.options.plugins.legend.labels.color = mutedColor; decisionChart.update(); }
                if(radarChart) { radarChart.data.datasets[0].backgroundColor = `rgba(56, 189, 248, 0.4)`; radarChart.data.datasets[0].borderColor = primary2Color; radarChart.data.datasets[0].pointBackgroundColor = primary2Color; radarChart.options.scales.r.grid.color = lineColor; radarChart.options.scales.r.angleLines.color = lineColor; radarChart.options.scales.r.pointLabels.color = textColor; radarChart.options.scales.r.ticks.backdropColor = 'transparent'; radarChart.options.scales.r.ticks.color = mutedColor; radarChart.update(); }
                if(monthFocusChart) { monthFocusChart.data.datasets[0].backgroundColor = [artworkColor, videoColor, photoColor]; monthFocusChart.options.scales.x.ticks.color = mutedColor; monthFocusChart.options.scales.y.ticks.color = mutedColor; monthFocusChart.options.scales.y.grid.color = lineColor; monthFocusChart.update(); }
                if(kpiRadarChart) { kpiRadarChart.data.datasets[0].backgroundColor = `rgba(167, 139, 250, 0.4)`; kpiRadarChart.data.datasets[0].borderColor = primaryColor; kpiRadarChart.data.datasets[0].pointBackgroundColor = primaryColor; kpiRadarChart.options.scales.r.grid.color = lineColor; kpiRadarChart.options.scales.r.angleLines.color = lineColor; kpiRadarChart.options.scales.r.pointLabels.color = textColor; kpiRadarChart.options.scales.r.ticks.backdropColor = 'transparent'; kpiRadarChart.options.scales.r.ticks.color = mutedColor; kpiRadarChart.update(); }
                if(kpiBarChart) { kpiBarChart.data.datasets[0].backgroundColor = lineColor; kpiBarChart.data.datasets[1].backgroundColor = successColor; if(kpiBarChart.options.scales.x) kpiBarChart.options.scales.x.ticks.color = mutedColor; if(kpiBarChart.options.scales.y) { kpiBarChart.options.scales.y.ticks.color = mutedColor; kpiBarChart.options.scales.y.grid.color = lineColor; } if(kpiBarChart.options.plugins.legend) kpiBarChart.options.plugins.legend.labels.color = mutedColor; kpiBarChart.update(); }
            }
        } catch(e) {}
        
        if(document.getElementById('viewDashboard').classList.contains('active-view')) renderModernGantt();
    }
    window.setTheme = setTheme; const savedTheme = safeGetLS('portfolio_theme') || 'dark';

    function switchView(viewName) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
        document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
        if (viewName === 'dashboard') { document.getElementById('viewDashboard').classList.add('active-view'); document.querySelector('.nav-tab[onclick*="dashboard"]').classList.add('active'); filterTable(); renderModernGantt(); } 
        else if (viewName === 'showcase') { document.getElementById('viewShowcase').classList.add('active-view'); document.querySelector('.nav-tab[onclick*="showcase"]').classList.add('active'); renderShowcase(); } 
        else if (viewName === 'evaluation') { document.getElementById('viewEvaluation').classList.add('active-view'); document.querySelector('.nav-tab[onclick*="evaluation"]').classList.add('active'); renderFeedback(); } 
        else if (viewName === 'monthlySummary') { document.getElementById('viewMonthlySummary').classList.add('active-view'); document.querySelector('.nav-tab[onclick*="monthlySummary"]').classList.add('active'); renderMonthlySummary(); } 
        else if (viewName === 'personalKPI') { document.getElementById('viewPersonalKPI').classList.add('active-view'); document.querySelector('.nav-tab[onclick*="personalKPI"]').classList.add('active'); renderPersonalKPI(); }
    }
    window.switchView = switchView;

    function isOverdue(p) {
        if (!p || p['สถานะ'] === 'เสร็จสิ้น' || !p.dateEnd) return false;
        const today = new Date(); today.setHours(0,0,0,0);
        const due = new Date(p.dateEnd); if (isNaN(due.getTime())) return false;
        return due < today;
    }
    function daysOverdue(p) {
        const today = new Date(); today.setHours(0,0,0,0); const due = new Date(p.dateEnd); due.setHours(0,0,0,0);
        return Math.max(1, Math.round((today - due) / 86400000));
    }
    function computeStats(data) {
        const s = { total: data.length, ArtWork: 0, Video: 0, Photography: 0, done: 0, prog: 0, pend: 0, overdue: 0 };
        data.forEach(p => {
            if (s[p['ประเภทหลัก']] !== undefined) s[p['ประเภทหลัก']]++;
            if (p['สถานะ'] === 'เสร็จสิ้น') s.done++; else if (p['สถานะ'] === 'กำลังดำเนินการ') s.prog++; else if (p['สถานะ'] === 'รอดำเนินการ') s.pend++;
            if (isOverdue(p)) s.overdue++;
        });
        s.active = s.prog + s.pend; return s;
    }

    function animateCount(el, target, duration, suffix = "") {
        if (!el) return; const startVal = parseFloat(el.getAttribute('data-current')) || 0; el.setAttribute('data-current', target);
        if (startVal === target) { el.innerHTML = (Number.isInteger(target) ? target : target.toFixed(1)) + suffix; return; }
        const start = performance.now();
        function tick(now) {
            const progress = Math.min((now - start) / duration, 1); const eased = 1 - Math.pow(1 - progress, 3); const val = startVal + (target - startVal) * eased;
            el.innerHTML = (Number.isInteger(target) ? Math.round(val) : val.toFixed(1)) + suffix; if (progress < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    }

    function refreshAll(initial) {
        populateDateFilters(); 
        
        if (initial || !isDefaultSet) {
            const curDate = new Date(); const curMonth = (curDate.getMonth() + 1).toString().padStart(2, '0'); const curYear = curDate.getFullYear().toString();
            ['msFilterMonth', 'kpiFilterMonth'].forEach(id => { if(document.getElementById(id) && !document.getElementById(id).value) document.getElementById(id).value = curMonth; });
            ['msFilterYear', 'kpiFilterYear'].forEach(id => { if(document.getElementById(id) && !document.getElementById(id).value) document.getElementById(id).value = curYear; });
            isDefaultSet = true;
        }

        const s = computeStats(rawData);
        document.querySelectorAll('.kpi-value[data-kpi]').forEach(el => { const key = el.dataset.kpi; const target = s[key] !== undefined ? s[key] : 0; if (initial) { const delay = parseFloat(el.closest('.kpi-card').style.animationDelay || 0) * 1000; setTimeout(() => animateCount(el, target, 900), delay + 150); } else { animateCount(el, target, 500); } });
        document.getElementById('totalBadge').textContent = `รวมทั้งหมด ${s.total} โปรเจกต์`;
        const overdueCard = document.getElementById('kpiOverdueCard'); if (overdueCard) overdueCard.classList.toggle('has-overdue', s.overdue > 0);
        const pct = s.total ? Math.round((s.done / s.total) * 100) : 0; document.getElementById('rateValue').textContent = pct + '%'; setTimeout(() => { document.getElementById('rateFill').style.width = pct + '%'; }, initial ? 700 : 50);

        try {
            if (typeof typeChart !== 'undefined' && typeChart) {
                typeChart.data.labels = [`🎨 ArtWork (${s.ArtWork})`, `🎬 Video (${s.Video})`, `📸 Photography (${s.Photography})`]; typeChart.data.datasets[0].data = [s.ArtWork, s.Video, s.Photography]; typeChart.update();
                statusChart.data.labels = [`เสร็จสิ้น (${s.done})`, `กำลังดำเนินการ (${s.prog})`, `รอดำเนินการ (${s.pend})`]; statusChart.data.datasets[0].data = [s.done, s.prog, s.pend]; statusChart.update();
                animateCount(document.getElementById('typeCenterNum'), s.total, initial ? 900 : 500); animateCount(document.getElementById('statusCenterNum'), s.done, initial ? 900 : 500); updateMonthlyChart();
            }
        } catch(e) {}

        filterTable(); renderShowcase(); renderFeedback(); renderModernGantt();
        renderMonthlySummary(); renderPersonalKPI();
    }

    function updateMonthlyChart() {
        if(!monthlyChart) return; const monthCounts = {};
        rawData.forEach(p => { const d = p.dateEnd || p.dateStart || p.dateOrder; if (d && p['สถานะ'] === 'เสร็จสิ้น') { const [y, m] = d.split('-'); if (y && m) monthCounts[`${y}-${m}`] = (monthCounts[`${y}-${m}`] || 0) + 1; } });
        const sortedMonths = Object.keys(monthCounts).sort();
        monthlyChart.data.labels = sortedMonths.map(k => { const [y, m] = k.split('-'); return new Date(y, m - 1, 1).toLocaleDateString('th-TH', { month: 'short', year: '2-digit' }); });
        monthlyChart.data.datasets[0].data = sortedMonths.map(k => monthCounts[k]); monthlyChart.update();
    }
    
    // ================= MONTHLY SUMMARY =================
    function getMonthlyFilteredData(m, y) {
        return rawData.filter(p => {
            if(p['สถานะ'] !== 'เสร็จสิ้น') return false;
            const pd = p.dateEnd || p.dateStart || p.dateOrder || ""; if(!pd) return false;
            const [pY, pM] = pd.split('-');
            if (y && y !== "all" && y !== "nodate" && pY !== y) return false; 
            if (m && m !== "all" && pM !== m) return false;
            return true;
        });
    }

    function renderMonthlySummary() {
        const m = document.getElementById('msFilterMonth').value; const y = document.getElementById('msFilterYear').value; const filtered = getMonthlyFilteredData(m, y);
        let counts = { 'ArtWork': 0, 'Video': 0, 'Photography': 0 }; let totalDays = 0; let projectsWithValidDays = 0;
        filtered.forEach(p => { if (counts[p['ประเภทหลัก']] !== undefined) counts[p['ประเภทหลัก']]++; const startDay = p.dateStart || p.dateOrder; if(startDay && p.dateEnd) { const d = getDaysDiff(startDay, p.dateEnd); if (d !== null) { totalDays += d; projectsWithValidDays++; } } });

        const totalProjects = filtered.length; const avgDays = projectsWithValidDays > 0 ? (totalDays / projectsWithValidDays) : 0;
        let topCatStr = '-';
        if (totalProjects > 0) { let maxCount = -1; for (const [cat, count] of Object.entries(counts)) { if (count > maxCount) { maxCount = count; topCatStr = cat; } } if(topCatStr === 'ArtWork') topCatStr = '🎨 ArtWork'; else if(topCatStr === 'Video') topCatStr = '🎬 Video'; else if(topCatStr === 'Photography') topCatStr = '📸 Photography'; }

        animateCount(document.getElementById('msTotal'), totalProjects, 600); document.getElementById('msTopCat').textContent = topCatStr; animateCount(document.getElementById('msAvgDays'), avgDays, 600);
        if(monthFocusChart) { monthFocusChart.data.datasets[0].data = [counts['ArtWork'], counts['Video'], counts['Photography']]; monthFocusChart.update(); }

        const tbody = document.getElementById('msDataTable'); tbody.innerHTML = '';
        if(filtered.length === 0) { tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--muted); font-size:1.1rem;">ยังไม่มีข้อมูลผลงานที่เสร็จสิ้นในช่วงเวลานี้ 📭</td></tr>`; return; }

        filtered.sort((a,b) => new Date(b.dateEnd || 0) - new Date(a.dateEnd || 0)).forEach((p, idx) => {
            const tr = document.createElement('tr'); tr.className = 'row-in'; tr.style.animationDelay = (Math.min(idx, 20) * 0.03) + 's';
            let tagClass = p['ประเภทหลัก'] === "Video" ? 'tag-video' : (p['ประเภทหลัก'] === "Photography" ? 'tag-photo' : 'tag-artwork');
            const startDay = p.dateStart || p.dateOrder; const leadTime = (startDay && p.dateEnd) ? getDaysDiff(startDay, p.dateEnd) + ' วัน' : '-';
            tr.innerHTML = `<td style="color:var(--muted);">#${p['ลำดับ']}</td><td><span class="${tagClass}">${p['ประเภทหลัก']}</span></td><td style="color:var(--text); font-weight:600;">${p['ชื่อชิ้นงาน / โปรเจกต์']}</td><td>👤 ${p['ผู้มอบหมาย']}</td><td>${formatDateThai(p.dateEnd)}</td><td style="color:var(--success); font-weight:700;">⏱️ ${leadTime}</td>`; tbody.appendChild(tr);
        });
    }

    function exportMonthlyCSV() {
        const m = document.getElementById('msFilterMonth').value; const y = document.getElementById('msFilterYear').value; const filtered = getMonthlyFilteredData(m, y);
        if(filtered.length === 0) { alert('ไม่มีข้อมูลสำหรับเดือน/ปีนี้เพื่อ Export ครับ'); return; }
        let csvContent = "\uFEFF"; csvContent += "ลำดับ,ประเภทหลัก,ประเภทย่อย,แคมเปญ,ชื่อชิ้นงาน / โปรเจกต์,ผู้มอบหมายงาน,โปรแกรมที่ใช้,AI Prompt,การแก้ดราฟต์,วันที่รับบรีฟ,วันที่เริ่มทำ,วันที่เสร็จสิ้น,ระยะเวลา(วัน),สถานะ\n";
        filtered.forEach(p => {
            const startDay = p.dateStart || p.dateOrder; const days = (startDay && p.dateEnd) ? getDaysDiff(startDay, p.dateEnd) : '-';
            const row = [
                p['ลำดับ'], p['ประเภทหลัก'], `"${(p['ประเภทย่อย'] || '').replace(/"/g, '""')}"`, `"${(p['campaign'] || '').replace(/"/g, '""')}"`, `"${(p['ชื่อชิ้นงาน / โปรเจกต์'] || '').replace(/"/g, '""')}"`,

    // ---- MODERN CSS GANTT CHART ----
    function renderModernGantt() {
        const container = document.getElementById('cssGanttChart'); if(!container) return;
        let validProjects = []; let minTime = Infinity; let maxTime = -Infinity;
        rawData.forEach(p => {
            if(p.dateStart && p.dateEnd) {
                let s = new Date(p.dateStart).getTime(); let e = new Date(p.dateEnd).getTime();
                if(s === e) e += 86400000; 
                if(s < minTime) minTime = s; if(e > maxTime) maxTime = e;
                validProjects.push({ ...p, sTime: s, eTime: e });
            }
        });
        if(validProjects.length === 0) { container.innerHTML = "<div style='display:flex; align-items:center; justify-content:center; height:150px; color:var(--muted); font-size:1.1rem;'>ยังไม่มีข้อมูลวันที่สำหรับสร้างกราฟ Timeline</div>"; return; }
        const paddingTime = (maxTime - minTime) * 0.05; minTime -= paddingTime; maxTime += paddingTime; const totalDuration = maxTime - minTime;
        let headerHtml = `<div class="gantt-header"><div class="gantt-header-label">ชื่อโปรเจกต์</div><div class="gantt-header-timeline">`;
        let currentMonth = new Date(minTime); currentMonth.setDate(1);
        while(currentMonth.getTime() <= maxTime) {
            let leftPct = ((currentMonth.getTime() - minTime) / totalDuration) * 100;
            if(leftPct >= 0 && leftPct <= 100) { let mLabel = currentMonth.toLocaleDateString('th-TH', {month:'short', year:'2-digit'}); headerHtml += `<div style="position:absolute; left:${leftPct}%; transform:translateX(-50%); border-left:1px dashed var(--line); padding-left:4px; height:100vh; z-index:0;">${mLabel}</div>`; }
            currentMonth.setMonth(currentMonth.getMonth() + 1);
        }
        headerHtml += `</div></div>`;
        let rowsHtml = '';
        validProjects.sort((a,b) => a.sTime - b.sTime).forEach(p => {
            let leftPct = ((p.sTime - minTime) / totalDuration) * 100; let widthPct = ((p.eTime - p.sTime) / totalDuration) * 100;
            let colorClass = 'gb-artwork'; let icon = '🎨'; if(p['ประเภทหลัก'] === 'Video') { colorClass = 'gb-video'; icon = '🎬'; } else if(p['ประเภทหลัก'] === 'Photography') { colorClass = 'gb-photo'; icon = '📸'; }
            rowsHtml += `<div class="gantt-row"><div class="gantt-label" title="${p['ชื่อชิ้นงาน / โปรเจกต์']}">${icon} ${p['ชื่อชิ้นงาน / โปรเจกต์']}</div><div class="gantt-track"><div class="gantt-bar ${colorClass}" style="left:${leftPct}%; width:${widthPct}%;" title="${formatDateThai(p.dateStart)} - ${formatDateThai(p.dateEnd)}">${p['ชื่อชิ้นงาน / โปรเจกต์']}</div></div></div>`;
        });
        container.innerHTML = headerHtml + rowsHtml;
    }

    let tableSortKey = null; let tableSortDir = 1;
    function sortTableBy(key) {
        if (tableSortKey === key) tableSortDir *= -1; else { tableSortKey = key; tableSortDir = 1; }
        document.querySelectorAll('#dataTable').forEach(() => {});
        document.querySelectorAll('.table-box thead th.sortable').forEach(th => {
            th.classList.toggle('sort-active', th.dataset.key === key);
            const arrow = th.querySelector('.sort-arrow'); if (arrow) arrow.textContent = th.dataset.key === key ? (tableSortDir === 1 ? '▲' : '▼') : '▲▼';
        });
        filterTable();
    }
    window.sortTableBy = sortTableBy;

    function applySortToTable(list) {
        if (!tableSortKey) return list;
        const key = tableSortKey; const dir = tableSortDir;
        return [...list].sort((a, b) => {
            let va, vb;
            if (key === 'dateEnd') { va = a.dateEnd || a.dateStart || a.dateOrder || ''; vb = b.dateEnd || b.dateStart || b.dateOrder || ''; }
            else { va = a[key]; vb = b[key]; }
            if (key === 'ลำดับ') { va = Number(va) || 0; vb = Number(vb) || 0; return (va - vb) * dir; }
            va = (va || '').toString(); vb = (vb || '').toString();
            return va.localeCompare(vb, 'th') * dir;
        });
    }

    function filterTable() {
        const search = document.getElementById('searchInput').value.toLowerCase(); const category = document.getElementById('categoryFilter').value; const fDay = document.getElementById('filterDay').value; const fMonth = document.getElementById('filterMonth').value; const fYear = document.getElementById('filterYear').value;

            const matchCategory = category === "all" || category === "" || p['ประเภทหลัก'] === category;
            let matchDate = true;
            if (fYear === "nodate") { const pd = p.dateEnd || p.dateStart || p.dateOrder || ""; matchDate = pd.trim() === ""; } 
            else {
                const pd = p.dateEnd || p.dateStart || p.dateOrder || "";
                if (pd) { const [pY, pM, pD] = pd.split('-'); if (fYear && fYear !== "all" && pY !== fYear) matchDate = false; if (fMonth && fMonth !== "all" && pM !== fMonth) matchDate = false; if (fDay && fDay !== "all" && pD !== fDay) matchDate = false; } 
                else { if ((fYear && fYear !== "all") || (fMonth && fMonth !== "all") || (fDay && fDay !== "all")) matchDate = false; }
                if (!matchDate && fYear && fYear !== "all" && !fMonth && !fDay && pd.trim() === "") { if (p['ชื่อชิ้นงาน / โปรเจกต์'] && p['ชื่อชิ้นงาน / โปรเจกต์'].includes(fYear)) matchDate = true; }
            }
            return matchSearch && matchCategory && matchDate;
        }); renderTable(applySortToTable(filtered));
    }

        return link;
    }

            let pVal = 0;
            const messages = ["DUMPING OXYGEN...", "NAVIGATING TO DEEP SERVER...", "TREASURE FOUND!", "SURFACING WORKSPACE..."];
            let msgIdx = 0;
            
            const interval = setInterval(() => {

                if(pVal > 100) pVal = 100;
                
                progress.style.width = pVal + '%';
                percentText.textContent = Math.floor(pVal) + '%';

                if (pVal > 88 && msgIdx === 2) { loaderText.textContent = messages[3]; loaderText.style.color = '#e0f2fe'; loaderText.style.textShadow = 'none'; msgIdx++; }
                
                if(pVal === 100) {

    function handleFileUpload(event) {
        const files = event.target.files; if (!files || files.length === 0) return;
        const info = document.getElementById('uploadPreviewInfo'); if(info) info.textContent = `⏳ กำลังบีบอัดและโหลดรูปภาพ...`;
        let loadedCount = 0;
        for (let i = 0; i < files.length; i++) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas'); let width = img.width; let height = img.height;
                    if (width > height) { if (width > 1200) { height *= 1200 / width; width = 1200; } } else { if (height > 1200) { width *= 1200 / height; height = 1200; } }
                    canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    editingProjectImages.push(canvas.toDataURL('image/jpeg', 0.8)); loadedCount++;
                    if (loadedCount === files.length) { renderEditThumbnails(); const upInput = document.getElementById('fUpload'); if(upInput) upInput.value = ''; if(info) info.textContent = `✅ บีบอัดและโหลดรูปสำเร็จ ${loadedCount} รูปแล้ว`; }
                }; img.src = e.target.result;
            }; reader.readAsDataURL(files[i]);
        }

            else if(file.type.includes('pdf')) icon = '📕';
            
            const chip = document.createElement('div');
            chip.className = 'evidence-chip';
            chip.innerHTML = `${icon} <span style="max-width:120px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${file.name}</span> 
            <span style="color:var(--danger); cursor:pointer; font-weight:bold; margin-left:4px;" onclick="this.parentElement.remove()" title="ลบไฟล์นี้">✕</span>`;
            
            container.appendChild(chip);
        });
        
        event.target.value = ''; 
    }
    window.handleKpiEvidence = handleKpiEvidence;

    // ============ init charts & data ============
    try {
        if (typeof Chart !== 'undefined') {
            const style = getComputedStyle(document.documentElement); function getCSSVar(name, def) { return style.getPropertyValue(name).trim() || def; }
            const legendLabelStyle = { font: { family: 'Kanit', size: 14 }, color: getCSSVar('--muted', '#aab6cc'), padding: 18, usePointStyle: true, pointStyle: 'circle' };
            const doughnutOptions = { responsive: true, maintainAspectRatio: false, cutout: '75%', animation: { animateRotate: true, animateScale: true, duration: 1200, easing: 'easeOutQuart' }, plugins: { legend: { position: 'bottom', labels: legendLabelStyle } } };

            typeChart = new Chart(document.getElementById('typeChart').getContext('2d'), { type: 'doughnut', data: { labels: [], datasets: [{ data: [], borderWidth: 0, hoverOffset: 12 }] }, options: doughnutOptions });
            statusChart = new Chart(document.getElementById('statusChart').getContext('2d'), { type: 'doughnut', data: { labels: [], datasets: [{ data: [], borderWidth: 0, hoverOffset: 12 }] }, options: doughnutOptions });
            monthlyChart = new Chart(document.getElementById('monthlyChart').getContext('2d'), { type: 'bar', data: { labels: [], datasets: [{ label: 'จำนวนงานที่เสร็จสิ้น (โปรเจกต์)', data: [], borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } } });
            decisionChart = new Chart(document.getElementById('decisionChart').getContext('2d'), { type: 'doughnut', data: { labels: ['Approve', 'Minor Edit', 'Reject'], datasets: [{ data: [0,0,0], borderWidth: 0 }] }, options: doughnutOptions });
            radarChart = new Chart(document.getElementById('radarChart').getContext('2d'), { type: 'radar', data: { labels: ['เนื้อหา (Brief)', 'ความสวยงาม (CI)', 'ใช้งานได้จริง (Usability)', 'ตรงเวลา (Timeline)', 'ภาพรวม (Overall)'], datasets: [{ label: 'คะแนนเฉลี่ย', data: [0,0,0,0,0], fill: true, borderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { r: { min: 0, max: 5, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } } });
            monthFocusChart = new Chart(document.getElementById('monthFocusChart').getContext('2d'), { type: 'bar', data: { labels: ['🎨 ArtWork', '🎬 Video', '📸 Photography'], datasets: [{ label: 'จำนวนงานที่เสร็จสิ้น', data: [0,0,0], borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } } });
            kpiRadarChart = new Chart(document.getElementById('kpiRadarChart').getContext('2d'), { type: 'radar', data: { labels: ['ความคิดสร้างสรรค์', 'ทักษะทำสื่อ & เทคโนโลยี', 'การสื่อสาร & ประสานงาน', 'ความละเอียดรอบคอบ (CI)', 'ความรับผิดชอบ & ตรงเวลา'], datasets: [{ label: 'ระดับสมรรถนะประเมิน (เต็ม 5)', data: [0,0,0,0,0], fill: true, borderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { r: { min: 0, max: 5, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } } });
            
            kpiBarChart = new Chart(document.getElementById('kpiBarChart').getContext('2d'), { 
                type: 'bar', 
                data: { labels: ['ปริมาณงานประจำเดือน (Projects)'], datasets: [{ label: 'เป้าหมายที่ต้องทำ (Target)', data: [10], borderRadius: 6 }, { label: 'ทำได้จริง (Actual)', data: [0], borderRadius: 6 }] }, 
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    scales: { 
                        x: { ticks: {} }, 
                        y: { beginAtZero: true, ticks: { stepSize: 2 } } 
                    }, 
                    plugins: { legend: { position: 'bottom', labels: { font: { family: 'Kanit' } } } } 
                } 
            });
        }
    } catch (err) {}

    // ================== FETCH FIREBASE ON LOAD ==================
    database.ref('/').once('value').then((snapshot) => {
        const data = snapshot.val();
        if (data) {
            if (data.projects) rawData = data.projects;
            if (data.evaluations) evalData = data.evaluations;
            safeSetLS(STORAGE_KEY, JSON.stringify(rawData));
            safeSetLS(EVAL_KEY, JSON.stringify(evalData));
        }
        setTheme(savedTheme); 
        refreshAll(true);
    }).catch((error) => {
        console.error("โหลดข้อมูลจาก Firebase ไม่สำเร็จ ใช้ข้อมูลในเครื่องแทน", error);
        setTheme(savedTheme); 
        refreshAll(true);
    });
    // ============================================================
</script>
