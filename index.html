<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Rescue My Data</title>
</head>
<body style="background:#121521; color:#fff; font-family:sans-serif; text-align:center; padding:50px;">
    <h2>กำลังกู้คืนข้อมูลเก่าของคุณ...</h2>
    <button onclick="rescueData()" style="padding:15px 30px; font-size:18px; cursor:pointer; background:#38bdf8; border:none; border-radius:10px;">คลิกดาวน์โหลดไฟล์ Backup (JSON)</button>
    
    <script>
        function rescueData() {
            // ไปดึงข้อมูลที่ซ่อนอยู่ในเบราว์เซอร์
            const projStr = localStorage.getItem('MasterPortfolio_DB_Ultimate23_Fast');
            const evalStr = localStorage.getItem('MasterPortfolio_EVAL_DB_v10');
            
            const projects = (projStr && projStr !== "[]") ? JSON.parse(projStr) : [];
            const evals = evalStr ? JSON.parse(evalStr) : [];
            
            if (projects.length === 0 && evals.length === 0) {
                alert("ไม่พบข้อมูลเก่าในเครื่องนี้เลยครับ 🥲 (อาจจะถูกล้างประวัติเบราว์เซอร์ไปแล้ว หรือเปิดผิดเบราว์เซอร์)");
                return;
            }
            
            // จับมัดรวมเป็นไฟล์ JSON
            const payload = { 
                app: 'MasterPortfolio', 
                exportedAt: new Date().toISOString(), 
                projects: projects, 
                evaluations: evals 
            };
            
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; 
            a.download = `Portfolio_Backup_RESCUED.json`;
            document.body.appendChild(a); 
            a.click(); 
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
    </script>
</body>
</html>
